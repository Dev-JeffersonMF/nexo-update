name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: 27.1.12297006
          build-tools-version: 36.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: ./NexusAssistente

      - name: Build Release APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          cd android
          ./gradlew.bat assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
        working-directory: ./NexusAssistente

      - name: Verify APK
        run: |
          APK_PATH="NexusAssistente/android/app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "APK found: $(ls -lh $APK_PATH)"
            echo "APK_SHA256=$(sha256sum $APK_PATH | cut -d' ' -f1)" >> $GITHUB_ENV
          else
            echo "APK not found!"
            exit 1
          fi
        working-directory: ./NexusAssistente

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: NexusAssistente/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: NexusAssistente/android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Latest Release
        if: success()
        run: |
          # This will be handled by the releases repository workflow
          echo "Release created successfully"